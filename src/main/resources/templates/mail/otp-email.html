<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 40px auto; background: #fff;
                     border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background: #e64553; padding: 24px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 20px; }
        .body { padding: 32px; }
        .otp-box { background: #F3F4F6; border-radius: 8px; text-align: center;
                   padding: 24px; margin: 24px 0; letter-spacing: 12px;
                   font-size: 36px; font-weight: bold; color: #e64553; }
        .footer { text-align: center; padding: 16px; font-size: 12px; color: #9CA3AF; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Verifikasi Akun Anda</h1>
    </div>
    <div class="body">
        <p>Halo, <strong th:text="${name}">User</strong>!</p>
        <p>Gunakan kode OTP berikut untuk verifikasi:</p>

        <div class="otp-box" th:text="${otpCode}">000000</div>

        <p>Kode berlaku selama <strong th:text="${expiryMinutes}">5</strong> menit.</p>
        <p style="color: #EF4444;">Jangan bagikan kode ini kepada siapapun.</p>
    </div>
    <div class="footer">
        <p>Jika kamu tidak merasa melakukan ini, abaikan email ini.</p>
        <p>&copy; 2025 Suisei App</p>
    </div>
</div>
</body>
</html>
